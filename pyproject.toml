[project]
name = "gallop"
version = "0.1.0"
description = "Headless Python port of Ballinasloe Gallop (level 1) for evolutionary computing"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
render = ["pygame-ce>=2.5"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gallop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
