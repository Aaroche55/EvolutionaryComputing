[project]
name = "gallop"
version = "0.1.0"
description = "Headless Python port of Ballinasloe Gallop (level 1) for evolutionary computing"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.14.4",
]

[project.optional-dependencies]
render = ["pygame-ce>=2.5"]
plot = [
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gallop", "evolution"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]   # keep hand-aligned code examples in docs as written

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PIE",      # flake8-pie
    "RET",      # flake8-return
    "PTH",      # prefer pathlib
    "PT",       # flake8-pytest-style
    "RUF",      # ruff-specific
]
ignore = [
    "N818",     # exception names: GenomeExhausted reads better than GenomeExhaustedError
]

[tool.ruff.lint.isort]
known-first-party = ["gallop", "evolution"]
known-local-folder = ["conftest"]

[tool.ty.environment]
python-version = "3.13"
